<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowMind — AI Flowchart Generator</title>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/reactflow@11/dist/style.css" />
  <script src="https://unpkg.com/reactflow@11/dist/umd/index.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #f1f5f9; height: 100vh; overflow: hidden; }
    #root { height: 100vh; }
    .app { display: flex; height: 100vh; }

    /* Left panel */
    .left-panel { width: 370px; min-width: 300px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; }
    .header { padding: 14px 18px; border-bottom: 1px solid #334155; }
    .header h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .header p { font-size: 11px; color: #64748b; margin-top: 3px; }
    .badge { background: #6366f1; color: white; font-size: 9px; padding: 2px 6px; border-radius: 99px; font-weight: 700; letter-spacing: 0.5px; }

    /* Demo banner */
    .demo-banner { margin: 8px 12px 0; background: #1c1917; border: 1px solid #78350f; border-radius: 7px; padding: 7px 10px; font-size: 11px; color: #d97706; line-height: 1.4; }
    .demo-banner code { background: #292524; padding: 1px 4px; border-radius: 3px; font-size: 10px; }

    /* Sample prompts */
    .samples { padding: 10px 12px; border-bottom: 1px solid #334155; }
    .samples-title { font-size: 10px; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 7px; }
    .sample-btn { display: block; width: 100%; text-align: left; padding: 7px 9px; background: #0f172a; border: 1px solid #334155; border-radius: 7px; color: #94a3b8; font-size: 11px; cursor: pointer; margin-bottom: 5px; line-height: 1.4; transition: all 0.15s; font-family: inherit; }
    .sample-btn:hover { border-color: #6366f1; color: #e2e8f0; }
    .sample-lang { font-size: 9px; color: #818cf8; font-weight: 700; margin-bottom: 2px; text-transform: uppercase; }

    /* Chat */
    .chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .chat-messages::-webkit-scrollbar { width: 3px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    .msg-user { align-self: flex-end; max-width: 90%; }
    .msg-ai { align-self: flex-start; max-width: 95%; }
    .msg-label { font-size: 10px; color: #64748b; margin-bottom: 3px; padding: 0 3px; }
    .msg-user .msg-label { text-align: right; }
    .msg-bubble { padding: 9px 12px; border-radius: 10px; font-size: 12px; line-height: 1.5; }
    .msg-user .msg-bubble { background: #6366f1; color: white; border-bottom-right-radius: 3px; }
    .msg-ai .msg-bubble { background: #334155; color: #e2e8f0; border-bottom-left-radius: 3px; }
    .loading-dots { display: flex; gap: 4px; padding: 10px 12px; background: #334155; border-radius: 10px; border-bottom-left-radius: 3px; }
    .dot { width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; animation: bbounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bonce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
    @keyframes bonce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    /* Input */
    .input-area { padding: 10px 12px; border-top: 1px solid #334155; }
    .input-row { display: flex; gap: 7px; align-items: flex-end; }
    .input-box { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 9px; padding: 9px 11px; color: #f1f5f9; font-size: 12px; resize: none; min-height: 40px; max-height: 100px; outline: none; font-family: inherit; line-height: 1.4; transition: border-color 0.15s; }
    .input-box:focus { border-color: #6366f1; }
    .input-box::placeholder { color: #475569; }
    .send-btn { background: #6366f1; color: white; border: none; border-radius: 9px; padding: 9px 14px; cursor: pointer; font-size: 12px; font-weight: 700; height: 40px; white-space: nowrap; transition: background 0.15s; font-family: inherit; }
    .send-btn:hover:not(:disabled) { background: #4f46e5; }
    .send-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

    /* Right panel / canvas */
    .right-panel { flex: 1; position: relative; background: #0f172a; }
    .canvas-toolbar { position: absolute; top: 12px; left: 12px; z-index: 10; display: flex; gap: 8px; align-items: center; pointer-events: none; }
    .toolbar-chip { background: #1e293bdd; backdrop-filter: blur(4px); border: 1px solid #334155; border-radius: 7px; padding: 5px 10px; font-size: 11px; color: #94a3b8; }
    .toolbar-chip b { color: #f1f5f9; }

    /* Empty state */
    .empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; pointer-events: none; }
    .empty-icon { font-size: 52px; opacity: 0.15; }
    .empty-title { font-size: 17px; color: #334155; font-weight: 700; }
    .empty-sub { font-size: 12px; color: #1e293b; }

    /* Custom nodes */
    .n-oval { padding: 9px 22px; border-radius: 999px; font-size: 12px; font-weight: 700; text-align: center; min-width: 110px; border: 2px solid; }
    .n-start { background: #312e81; border-color: #6366f1; color: #c7d2fe; box-shadow: 0 0 16px #6366f130; }
    .n-end   { background: #14532d; border-color: #22c55e; color: #bbf7d0; box-shadow: 0 0 16px #22c55e30; }
    .n-rect  { padding: 10px 14px; border-radius: 7px; font-size: 12px; font-weight: 500; text-align: center; min-width: 140px; border: 2px solid #3b82f6; background: #1e3a5f; color: #bfdbfe; box-shadow: 0 0 12px #3b82f620; }
    .n-diamond-wrap { display: flex; align-items: center; justify-content: center; width: 160px; height: 84px; }
    .n-diamond { width: 140px; height: 72px; background: #451a03; border: 2px solid #f59e0b; color: #fde68a; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; transform: rotate(45deg); box-shadow: 0 0 14px #f59e0b30; }
    .n-diamond-text { transform: rotate(-45deg); padding: 4px; max-width: 90px; word-break: break-word; line-height: 1.3; }

    /* Reactflow theme */
    .react-flow__controls { background: #1e293b !important; border: 1px solid #334155 !important; border-radius: 8px !important; overflow: hidden; }
    .react-flow__controls-button { background: #1e293b !important; border-bottom: 1px solid #334155 !important; color: #94a3b8 !important; fill: #94a3b8 !important; }
    .react-flow__controls-button:hover { background: #334155 !important; }
    .react-flow__minimap { background: #1e293b !important; border: 1px solid #334155 !important; border-radius: 8px !important; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-type="module">
  // Grab everything from the ReactFlow UMD global
  const RF = window.ReactFlow;
  const {
    default: ReactFlowComponent,
    ReactFlowProvider,
    Controls,
    MiniMap,
    Background,
    BackgroundVariant,
    useNodesState,
    useEdgesState,
    Handle,
    Position,
    MarkerType,
    useReactFlow,
  } = RF;

  const { useState, useCallback, useRef, useEffect } = React;

  // ── Demo data ──────────────────────────────────────────────────────────────

  const DEMOS = {
    login: {
      nodes: [
        { id:'n1', type:'start',    text:'Start' },
        { id:'n2', type:'process',  text:'Enter Credentials' },
        { id:'n3', type:'decision', text:'Login OK?' },
        { id:'n4', type:'process',  text:'Retry (Attempt 1)' },
        { id:'n5', type:'decision', text:'Login OK?' },
        { id:'n6', type:'process',  text:'Retry (Attempt 2)' },
        { id:'n7', type:'decision', text:'Login OK?' },
        { id:'n8', type:'process',  text:'Go to Dashboard' },
        { id:'n9', type:'end',      text:'End — Access Granted' },
        { id:'n10',type:'end',      text:'End — Access Denied' },
      ],
      edges: [
        {from:'n1',to:'n2',label:''},{from:'n2',to:'n3',label:''},
        {from:'n3',to:'n4',label:'No'},{from:'n3',to:'n8',label:'Yes'},
        {from:'n4',to:'n5',label:''},{from:'n5',to:'n6',label:'No'},
        {from:'n5',to:'n8',label:'Yes'},{from:'n6',to:'n7',label:''},
        {from:'n7',to:'n10',label:'No'},{from:'n7',to:'n8',label:'Yes'},
        {from:'n8',to:'n9',label:''},
      ],
    },
    payment: {
      nodes: [
        { id:'n1', type:'start',    text:'Start' },
        { id:'n2', type:'process',  text:'Initiate Payment' },
        { id:'n3', type:'decision', text:'Payment Successful?' },
        { id:'n4', type:'process',  text:'Retry Payment' },
        { id:'n5', type:'decision', text:'Retry Successful?' },
        { id:'n6', type:'process',  text:'Show Success Message' },
        { id:'n7', type:'end',      text:'End — Complete' },
        { id:'n8', type:'end',      text:'End — Failed' },
      ],
      edges: [
        {from:'n1',to:'n2',label:''},{from:'n2',to:'n3',label:''},
        {from:'n3',to:'n4',label:'Failure'},{from:'n3',to:'n6',label:'Success'},
        {from:'n4',to:'n5',label:''},{from:'n5',to:'n8',label:'No'},
        {from:'n5',to:'n6',label:'Yes'},{from:'n6',to:'n7',label:''},
      ],
    },
    hindi: {
      nodes: [
        { id:'n1', type:'start',    text:'शुरू' },
        { id:'n2', type:'process',  text:'Payment करें' },
        { id:'n3', type:'decision', text:'Payment सफल?' },
        { id:'n4', type:'process',  text:'दुबारा Try करें' },
        { id:'n5', type:'decision', text:'दुबारा सफल?' },
        { id:'n6', type:'process',  text:'Success दिखाओ' },
        { id:'n7', type:'end',      text:'समाप्त — सफल' },
        { id:'n8', type:'end',      text:'समाप्त — असफल' },
      ],
      edges: [
        {from:'n1',to:'n2',label:''},{from:'n2',to:'n3',label:''},
        {from:'n3',to:'n4',label:'नहीं'},{from:'n3',to:'n6',label:'हाँ'},
        {from:'n4',to:'n5',label:''},{from:'n5',to:'n8',label:'नहीं'},
        {from:'n5',to:'n6',label:'हाँ'},{from:'n6',to:'n7',label:''},
      ],
    },
    japanese: {
      nodes: [
        { id:'n1', type:'start',    text:'スタート' },
        { id:'n2', type:'process',  text:'ログイン試行' },
        { id:'n3', type:'decision', text:'ログイン成功?' },
        { id:'n4', type:'process',  text:'再試行する' },
        { id:'n5', type:'decision', text:'再試行成功?' },
        { id:'n6', type:'process',  text:'ダッシュボードへ' },
        { id:'n7', type:'end',      text:'終了 — 成功' },
        { id:'n8', type:'end',      text:'終了 — 失敗' },
      ],
      edges: [
        {from:'n1',to:'n2',label:''},{from:'n2',to:'n3',label:''},
        {from:'n3',to:'n4',label:'いいえ'},{from:'n3',to:'n6',label:'はい'},
        {from:'n4',to:'n5',label:''},{from:'n5',to:'n8',label:'いいえ'},
        {from:'n5',to:'n6',label:'はい'},{from:'n6',to:'n7',label:''},
      ],
    },
    chinese: {
      nodes: [
        { id:'n1', type:'start',    text:'开始' },
        { id:'n2', type:'process',  text:'发起支付' },
        { id:'n3', type:'decision', text:'支付成功?' },
        { id:'n4', type:'process',  text:'重试支付' },
        { id:'n5', type:'decision', text:'重试成功?' },
        { id:'n6', type:'process',  text:'显示成功消息' },
        { id:'n7', type:'end',      text:'结束 — 完成' },
        { id:'n8', type:'end',      text:'结束 — 失败' },
      ],
      edges: [
        {from:'n1',to:'n2',label:''},{from:'n2',to:'n3',label:''},
        {from:'n3',to:'n4',label:'否'},{from:'n3',to:'n6',label:'是'},
        {from:'n4',to:'n5',label:''},{from:'n5',to:'n8',label:'否'},
        {from:'n5',to:'n6',label:'是'},{from:'n6',to:'n7',label:''},
      ],
    },
  };

  function pickDemo(text) {
    const t = text.toLowerCase();
    if (t.includes('ログイン') || t.includes('再試行')) return DEMOS.japanese;
    if (t.includes('如果') || t.includes('重试') || t.includes('支付')) return DEMOS.chinese;
    if (t.includes('agar') || t.includes('dubara') || t.includes('payment fail')) return DEMOS.hindi;
    if (t.includes('payment') || t.includes('pay') || t.includes('success')) return DEMOS.payment;
    return DEMOS.login;
  }

  // ── Dagre layout ──────────────────────────────────────────────────────────

  const DIMS = { start:[140,44], end:[140,44], process:[180,58], decision:[160,84] };

  function applyLayout(flowData) {
    const g = new dagre.graphlib.Graph();
    g.setDefaultEdgeLabel(() => ({}));
    g.setGraph({ rankdir:'TB', nodesep:70, ranksep:90, marginx:50, marginy:50 });

    flowData.nodes.forEach(n => {
      const [w,h] = DIMS[n.type] || [160,58];
      g.setNode(n.id, { width:w, height:h });
    });
    flowData.edges.forEach((e,i) => g.setEdge(e.from, e.to, { id:`e${i}` }));
    dagre.layout(g);

    const order = {};
    flowData.nodes.forEach((n,i) => { order[n.id] = i; });

    const rfNodes = flowData.nodes.map(n => {
      const pos = g.node(n.id);
      const [w,h] = DIMS[n.type] || [160,58];
      const typeMap = { start:'startEndNode', end:'startEndNode', process:'processNode', decision:'decisionNode' };
      return {
        id: n.id,
        type: typeMap[n.type] || 'processNode',
        data: { label: n.text, nodeType: n.type },
        position: { x: pos.x - w/2, y: pos.y - h/2 },
      };
    });

    const rfEdges = flowData.edges.map((e,i) => {
      const backward = order[e.to] <= order[e.from];
      return {
        id: `edge-${i}`,
        source: e.from,
        target: e.to,
        label: e.label || undefined,
        animated: backward,
        type: 'smoothstep',
        markerEnd: { type: MarkerType.ArrowClosed, color: backward ? '#f59e0b' : '#6366f1' },
        style: { stroke: backward ? '#f59e0b' : '#6366f1', strokeWidth: 1.5 },
        labelStyle: { fill: '#94a3b8', fontWeight:700, fontSize:11 },
        labelBgStyle: { fill:'#1e293b', fillOpacity:0.95 },
        labelBgPadding: [4,4],
        labelBgBorderRadius: 4,
      };
    });

    return { nodes: rfNodes, edges: rfEdges };
  }

  // ── Custom node components ─────────────────────────────────────────────────

  function StartEndNode({ data }) {
    const cls = data.nodeType === 'end' ? 'n-oval n-end' : 'n-oval n-start';
    const clr = data.nodeType === 'end' ? '#22c55e' : '#6366f1';
    const hs  = { background: clr, border:'none', width:8, height:8 };
    return (
      <div className={cls}>
        <Handle type="target" position={Position.Top}    style={hs} />
        {data.label}
        <Handle type="source" position={Position.Bottom} style={hs} />
      </div>
    );
  }

  function ProcessNode({ data }) {
    return (
      <div className="n-rect">
        <Handle type="target" position={Position.Top}    style={{ background:'#3b82f6', border:'none', width:8, height:8 }} />
        {data.label}
        <Handle type="source" position={Position.Bottom} style={{ background:'#3b82f6', border:'none', width:8, height:8 }} />
      </div>
    );
  }

  function DecisionNode({ data }) {
    const hs = { background:'#f59e0b', border:'none', width:8, height:8 };
    return (
      <div className="n-diamond-wrap">
        <Handle type="target" position={Position.Top}    style={{ ...hs, top:0 }} />
        <div className="n-diamond">
          <div className="n-diamond-text">{data.label}</div>
        </div>
        <Handle type="source" position={Position.Bottom} style={{ ...hs, bottom:0 }} />
        <Handle type="source" id="right" position={Position.Right} style={{ ...hs }} />
        <Handle type="source" id="left"  position={Position.Left}  style={{ ...hs }} />
      </div>
    );
  }

  const nodeTypes = {
    startEndNode: StartEndNode,
    processNode:  ProcessNode,
    decisionNode: DecisionNode,
  };

  // ── Sample prompts ─────────────────────────────────────────────────────────

  const SAMPLES = [
    { lang:'EN', text:'If login fails, retry twice, else go to dashboard' },
    { lang:'HI', text:'Agar payment fail ho jaye toh dubara try karo, warna success dikhao' },
    { lang:'JA', text:'ログインに失敗した場合、再試行し、成功したらダッシュボードへ進む' },
    { lang:'ZH', text:'如果支付失败，请重试，否则显示成功' },
  ];

  // ── Canvas ─────────────────────────────────────────────────────────────────

  function Canvas({ flowData }) {
    const [nodes, setNodes, onNodesChange] = useNodesState([]);
    const [edges, setEdges, onEdgesChange] = useEdgesState([]);
    const { fitView } = useReactFlow();

    useEffect(() => {
      if (!flowData) return;
      const { nodes:n, edges:e } = applyLayout(flowData);
      setNodes(n);
      setEdges(e);
      setTimeout(() => fitView({ padding:0.15, duration:400 }), 60);
    }, [flowData]);

    if (!flowData) {
      return (
        <div className="empty-state">
          <div className="empty-icon">◇</div>
          <div className="empty-title">No flowchart yet</div>
          <div className="empty-sub">Pick a sample or type a prompt on the left</div>
        </div>
      );
    }

    return (
      <ReactFlowComponent
        nodes={nodes} edges={edges}
        onNodesChange={onNodesChange} onEdgesChange={onEdgesChange}
        nodeTypes={nodeTypes}
        fitView
        minZoom={0.15} maxZoom={2.5}
      >
        <Background variant="dots" gap={22} size={1} color="#1e293b" />
        <Controls />
        <MiniMap
          nodeColor={n => n.data?.nodeType==='decision' ? '#f59e0b' : n.data?.nodeType==='end' ? '#22c55e' : '#6366f1'}
          maskColor="#0f172a99"
          style={{ background:'#1e293b' }}
        />
      </ReactFlowComponent>
    );
  }

  // ── Main App ───────────────────────────────────────────────────────────────

  function App() {
    const [messages, setMessages] = useState([
      { role:'ai', text:'👋 Welcome to FlowMind! Click a sample prompt or type your own description to generate a flowchart. Supports English, Hindi, Japanese & Chinese.' }
    ]);
    const [input, setInput]     = useState('');
    const [loading, setLoading] = useState(false);
    const [flowData, setFlowData] = useState(null);
    const bottomRef = useRef(null);

    useEffect(() => { bottomRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages, loading]);

    const generate = useCallback(async (text) => {
      const prompt = text.trim();
      if (!prompt || loading) return;
      setInput('');
      setMessages(m => [...m, { role:'user', text: prompt }]);
      setLoading(true);
      await new Promise(r => setTimeout(r, 900));
      const demo = pickDemo(prompt);
      setFlowData(demo);
      setMessages(m => [...m, {
        role:'ai',
        text:`✅ Generated! ${demo.nodes.length} nodes · ${demo.edges.length} edges. (Demo mode — add an API key for live AI generation)`
      }]);
      setLoading(false);
    }, [loading]);

    const nc = flowData?.nodes?.length ?? 0;
    const ec = flowData?.edges?.length ?? 0;

    return (
      <div className="app">

        {/* ── Left ── */}
        <div className="left-panel">

          <div className="header">
            <h1>⬡ FlowMind <span className="badge">DEMO</span></h1>
            <p>AI-Powered Multilingual Flowchart Generator</p>
          </div>

          <div className="demo-banner">
            ⚡ Demo mode — pre-built flows. Set <code>ANTHROPIC_API_KEY</code> in the server for live AI.
          </div>

          <div className="samples">
            <div className="samples-title">Try a sample prompt</div>
            {SAMPLES.map((s,i) => (
              <button key={i} className="sample-btn" onClick={() => generate(s.text)}>
                <div className="sample-lang">{s.lang}</div>
                {s.text}
              </button>
            ))}
          </div>

          <div className="chat-messages">
            {messages.map((m,i) => (
              <div key={i} className={`msg-${m.role}`}>
                <div className="msg-label">{m.role==='user' ? 'You' : 'FlowMind AI'}</div>
                <div className="msg-bubble">{m.text}</div>
              </div>
            ))}
            {loading && (
              <div className="msg-ai">
                <div className="msg-label">FlowMind AI</div>
                <div className="loading-dots">
                  <div className="dot"/><div className="dot"/><div className="dot"/>
                </div>
              </div>
            )}
            <div ref={bottomRef} />
          </div>

          <div className="input-area">
            <div className="input-row">
              <textarea
                className="input-box"
                placeholder="Describe your flow… (any language)"
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); generate(input); } }}
                rows={1}
              />
              <button
                className="send-btn"
                onClick={() => generate(input)}
                disabled={loading || !input.trim()}
              >
                {loading ? '…' : 'Generate'}
              </button>
            </div>
          </div>
        </div>

        {/* ── Right ── */}
        <div className="right-panel">
          {flowData && (
            <div className="canvas-toolbar">
              <div className="toolbar-chip"><b>{nc}</b> nodes · <b>{ec}</b> edges</div>
            </div>
          )}
          <ReactFlowProvider>
            <Canvas flowData={flowData} />
          </ReactFlowProvider>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
